service_id: semaphore
service_name: semaphore
service_unit_name: semaphore
service_image: docker.io/semaphoreui/semaphore:v2.16.34
version: "2.16.34"
needs_container_runtime: true
service_ip: "{{ semaphore_service_ip }}"
service_ports:
  - target: 3000
    published: {{ semaphore_service_port }}
    protocol: tcp
service_env: "{{ semaphore_service_env | to_yaml | from_yaml }}"
service_volumes:
  - name: config
    source: "{{ semaphore_config_volume }}"
    target: /etc/semaphore
    driver: local
    size: "{{ semaphore_config_volume_size_gb }}Gi"
  - name: data
    source: "{{ semaphore_data_volume }}"
    target: /var/lib/semaphore
    driver: local
    size: "{{ semaphore_data_volume_size_gb }}Gi"
  - name: jobs
    source: "{{ semaphore_jobs_volume }}"
    target: /var/lib/semaphore/jobs
    driver: local
    size: "{{ semaphore_jobs_volume_size_gb }}Gi"
service_resources:
  memory_mb: "{{ semaphore_container_memory_mb }}"
  cpu_cores: "{{ semaphore_container_cpu_cores }}"
service_namespace: "{{ semaphore_kubernetes_namespace }}"
service_replicas: "{{ semaphore_kubernetes_replicas }}"
service_container:
  vmid: "{{ semaphore_container_vmid }}"
  hostname: "{{ service_name }}"
  ostemplate: "{{ semaphore_container_template }}"
  disk: "{{ semaphore_container_storage_gb }}"
  cores: "{{ semaphore_container_cpu_cores }}"
  memory: "{{ semaphore_container_memory_mb }}"
  swap: "{{ semaphore_container_swap_mb }}"
  bridge: "{{ semaphore_container_bridge }}"
  cidr: "{{ semaphore_container_cidr }}"
  gateway: "{{ semaphore_container_gateway }}"
  interface: "{{ semaphore_container_interface }}"
  onboot: yes
  unprivileged: yes
  features: nesting=1,keyctl=1
service_security:
  run_as_user: 1001
  run_as_group: 1001
  read_only_root_filesystem: true
  capabilities_drop:
    - ALL
  no_new_privileges: true
requires:
  - name: mariadb
    version: ">=10.3"
exports:
  env:
    - name: SEMAPHORE_URL
      value: "{{ semaphore_external_url }}"
      description: Base URL for Semaphore automation UI
    - name: SEMAPHORE_PORT
      value: "{{ semaphore_service_port | string }}"
      description: Published HTTP port
    - name: SEMAPHORE_ADMIN_EMAIL
      value: "{{ semaphore_admin_email }}"
      description: Default administrator email
    - name: APP_FQDN
      value: "{{ semaphore_external_hostname }}"
      description: External hostname served by the reverse proxy
    - name: APP_PORT
      value: "{{ semaphore_service_port | string }}"
      description: Published TCP port for downstream consumers
    - name: APP_BACKEND_IP
      value: "{{ service_ip }}"
      description: Backend service address used by edge automation
    - name: SEMAPHORE_WEBHOOK_URL
      value: "{{ semaphore_webhook_url }}"
      description: URL endpoint for triggering Semaphore jobs via webhook
mounts:
  persistent_volumes:
    - name: config
      path: /etc/semaphore
    - name: data
      path: /var/lib/semaphore
    - name: jobs
      path: /var/lib/semaphore/jobs
  ephemeral_mounts:
    - name: semaphore-run
      path: /run/semaphore
      apply_to: [docker, podman, proxmox, baremetal]
      medium: Memory
      size: 32Mi
      mode: '0755'
    - name: semaphore-tmp
      path: /tmp/semaphore
      apply_to: [docker, podman, kubernetes, proxmox, baremetal]
      medium: Memory
      size: 64Mi
health:
  cmd:
    - curl
    - -fsS
    - "http://127.0.0.1:{{ semaphore_service_port }}/"
  interval: 15s
  timeout: 10s
  retries: 5
startup_probe:
  cmd:
    - curl
    - -fsS
    - "http://127.0.0.1:{{ semaphore_service_port }}/api/ping"
  initial_delay: 60s
  period: 20s
readiness_probe:
  cmd:
    - curl
    - -fsS
    - "http://127.0.0.1:{{ semaphore_service_port }}/api/ping"
  period: 20s
storage:
  - name: config
    path: /etc/semaphore
    size: "{{ semaphore_config_volume_size_gb }}G"
  - name: data
    path: /var/lib/semaphore
    size: "{{ semaphore_data_volume_size_gb }}G"
  - name: jobs
    path: /var/lib/semaphore/jobs
    size: "{{ semaphore_jobs_volume_size_gb }}G"
runtime_templates:
  proxmox: proxmox.yml.j2
  docker: docker.yml.j2
  podman: podman.yml.j2
  kubernetes: kubernetes.yml.j2
  baremetal: baremetal.yml.j2
secrets:
  env: "{{ semaphore_secret_env | to_yaml | from_yaml }}"
  files: "{{ semaphore_secret_files | to_yaml | from_yaml }}"

semaphore_service_port: 3000
semaphore_config_volume: semaphore-config
semaphore_data_volume: semaphore-data
semaphore_config_volume_size_gb: 2
semaphore_data_volume_size_gb: 20
semaphore_jobs_volume: semaphore-jobs
semaphore_jobs_volume_size_gb: 10
semaphore_estimated_daily_artifacts_mb: 0
semaphore_container_vmid: 230
semaphore_container_ip: 192.168.100.14
semaphore_container_gateway: 192.168.100.1
semaphore_container_cidr: 24
semaphore_container_bridge: vmbr0
semaphore_container_interface: eth0
semaphore_prefer_ipv6: false
semaphore_service_ip: >-
  {% if semaphore_prefer_ipv6 | bool
        and ansible_default_ipv6 is defined
        and ansible_default_ipv6.address is defined
        and (ansible_default_ipv6.address | string | length) > 0 %}
  {{ ansible_default_ipv6.address }}
  {% else %}
  {{ semaphore_container_ip }}
  {% endif %}
# Resource sizing guidance:
# - For 10-50 concurrent tasks, the default reservation of 2 cores / 2048 MB is sufficient.
# - Scale to at least 4 cores / 4096 MB when sustaining more than 100 parallel tasks.
semaphore_container_cpu_cores: 2
semaphore_container_memory_mb: 2048
semaphore_container_swap_mb: 2048
semaphore_container_storage_gb: "{{ semaphore_config_volume_size_gb + semaphore_data_volume_size_gb }}"
semaphore_container_template: local:vztmpl/ubuntu-24.04-standard_24.04-2_amd64.tar.zst
semaphore_db_host: >-
  {% if dependency_exports is defined
        and dependency_exports.mariadb is defined
        and dependency_exports.mariadb.DATABASE_HOST is defined
        and dependency_exports.mariadb.DATABASE_HOST | string | length > 0 %}
  {{ dependency_exports.mariadb.DATABASE_HOST }}
  {% else %}
  {% set env_host = lookup('env', 'SEMAPHORE_DB_HOST') | default('', true) %}
  {{ env_host if env_host | length > 0 else 'mariadb' }}
  {% endif %}
semaphore_db_port: >-
  {% if dependency_exports is defined
        and dependency_exports.mariadb is defined
        and dependency_exports.mariadb.DATABASE_PORT is defined
        and dependency_exports.mariadb.DATABASE_PORT | string | length > 0 %}
  {{ dependency_exports.mariadb.DATABASE_PORT | int }}
  {% else %}
  {% set env_port = lookup('env', 'SEMAPHORE_DB_PORT') | default('', true) %}
  {{ env_port | int if env_port | length > 0 else 3306 }}
  {% endif %}
semaphore_db_host_bracketed: >-
  {% if ':' in semaphore_db_host and '[' not in semaphore_db_host and ']' not in semaphore_db_host %}
  [{{ semaphore_db_host }}]
  {% else %}
  {{ semaphore_db_host }}
  {% endif %}
semaphore_db_endpoint: "{{ semaphore_db_host_bracketed }}:{{ semaphore_db_port }}"
semaphore_db_user: >-
  {% set env_user = lookup('env', 'SEMAPHORE_DB_USER') | default('', true) %}
  {{ env_user if env_user | length > 0 else 'semaphore' }}
semaphore_db_name: >-
  {% set env_name = lookup('env', 'SEMAPHORE_DB_NAME') | default('', true) %}
  {{ env_name if env_name | length > 0 else 'semaphore' }}
semaphore_db_password: >-
  {% set env_password = lookup('env', 'SEMAPHORE_DB_PASSWORD') | default('', true) %}
  {{ env_password if env_password | length > 0 else semaphore_db_password_default }}
semaphore_db_dialect: >-
  {% set env_dialect = lookup('env', 'SEMAPHORE_DB_DIALECT') | default('', true) %}
  {{ env_dialect if env_dialect | length > 0 else 'mysql' }}
semaphore_admin_username: >-
  {% set env_admin_user = lookup('env', 'SEMAPHORE_ADMIN') | default('', true) %}
  {{ env_admin_user if env_admin_user | length > 0 else 'admin' }}
semaphore_admin_name: >-
  {% set env_admin_name = lookup('env', 'SEMAPHORE_ADMIN_NAME') | default('', true) %}
  {{ env_admin_name if env_admin_name | length > 0 else 'Automation Admin' }}
semaphore_admin_email: >-
  {% set env_admin_email = lookup('env', 'SEMAPHORE_ADMIN_EMAIL') | default('', true) %}
  {{ env_admin_email if env_admin_email | length > 0 else semaphore_admin_email_default }}
semaphore_admin_password: >-
  {% set env_admin_password = lookup('env', 'SEMAPHORE_ADMIN_PASSWORD') | default('', true) %}
  {{ env_admin_password if env_admin_password | length > 0 else semaphore_admin_password_default }}
semaphore_timezone: >-
  {% set env_timezone = lookup('env', 'SEMAPHORE_TZ') | default('', true) %}
  {{ env_timezone if env_timezone | length > 0 else 'UTC' }}
semaphore_web_root: >-
  {% set env_web_root = lookup('env', 'SEMAPHORE_WEB_ROOT') | default('', true) %}
  {{ env_web_root if env_web_root | length > 0 else '/' }}
semaphore_external_url: >-
  {% set env_external_url = lookup('env', 'SEMAPHORE_URL') | default('', true) %}
  {{ env_external_url if env_external_url | length > 0 else 'http://' ~ service_ip ~ ':' ~ (semaphore_service_port | string) }}
semaphore_external_hostname: >-
  {% set env_external_hostname = lookup('env', 'SEMAPHORE_FQDN') | default('', true) %}
  {{ env_external_hostname if env_external_hostname | length > 0 else semaphore_external_url | regex_replace('^https?://([^/:]+).*', '\\1') }}
semaphore_kubernetes_namespace: automation
semaphore_kubernetes_replicas: 1

semaphore_admin_email_default: admin@example.com
semaphore_admin_password_default: change-me-semaphore-admin
semaphore_db_password_default: change-me-semaphore-db
semaphore_required_mariadb_version: '10.3'
semaphore_password_min_length: 12
semaphore_password_complexity_regex: '^.*$'
semaphore_common_weak_passwords:
  - password
  - password123
  - password123!
  - password1!
  - admin
  - admin123
  - admin2024
  - changeme
  - semaphore
  - semaphore123
  - qwerty123
  - qwerty123!
  - letmein123
  - welcome123
semaphore_db_verify_connectivity: true
semaphore_verify_admin_password: false
semaphore_verify_admin_password_validate_certs: false
semaphore_db_connect_timeout: 30
semaphore_db_tls_enabled: true
semaphore_db_tls_skip_verify: false
semaphore_db_options: "tls={{ 'true' if semaphore_db_tls_enabled else 'false' }}&tls-skip-verify={{ 'true' if semaphore_db_tls_skip_verify else 'false' }}"
semaphore_db_max_open_conns: 50
semaphore_db_max_idle_conns: 10
semaphore_db_password_file_enabled: true
semaphore_admin_password_file_enabled: true
semaphore_db_password_file_path: "{{ semaphore_secret_mount_root }}/db_password"
semaphore_admin_password_file_path: "{{ semaphore_secret_mount_root }}/admin_password"
semaphore_secret_mount_prefix: /run/secrets
semaphore_secret_mount_root: "{{ semaphore_secret_mount_prefix }}"
semaphore_render_db_password_env: false
semaphore_cors_allowed_origins: ""
semaphore_session_timeout_seconds: 86400
semaphore_max_parallel_tasks: 25
semaphore_cleanup_days: 30
semaphore_git_strict_host_key_checking: true
semaphore_webhook_url: >-
  {% set env_webhook_url = lookup('env', 'SEMAPHORE_WEBHOOK_URL') | default('', true) %}
  {{ env_webhook_url if env_webhook_url | length > 0 else '' }}
semaphore_kubernetes_resources:
  limits:
    cpu: "{{ semaphore_container_cpu_cores }}"
    memory: "{{ semaphore_container_memory_mb }}Mi"
  requests:
    cpu: "{{ semaphore_container_cpu_cores }}"
    memory: "{{ semaphore_container_memory_mb }}Mi"

semaphore_service_env_base:
  - name: SEMAPHORE_DB_DIALECT
    value: "{{ semaphore_db_dialect }}"
  - name: SEMAPHORE_DB_HOST
    value: "{{ semaphore_db_host }}"
  - name: SEMAPHORE_DB_PORT
    value: "{{ semaphore_db_port | string }}"
  - name: SEMAPHORE_DB_USER
    value: "{{ semaphore_db_user }}"
  - name: SEMAPHORE_DB_NAME
    value: "{{ semaphore_db_name }}"
  - name: SEMAPHORE_DB_OPTIONS
    value: "{{ semaphore_db_options }}"
  - name: SEMAPHORE_DB_MAX_OPEN_CONNS
    value: "{{ semaphore_db_max_open_conns | string }}"
  - name: SEMAPHORE_DB_MAX_IDLE_CONNS
    value: "{{ semaphore_db_max_idle_conns | string }}"
  - name: SEMAPHORE_DB_PASSWORD_FILE
    value: "{{ semaphore_db_password_file_path if semaphore_db_password_file_enabled else '' }}"
  - name: SEMAPHORE_ADMIN
    value: "{{ semaphore_admin_username }}"
  - name: SEMAPHORE_ADMIN_NAME
    value: "{{ semaphore_admin_name }}"
  - name: SEMAPHORE_ADMIN_EMAIL
    value: "{{ semaphore_admin_email }}"
  - name: SEMAPHORE_ADMIN_PASSWORD_FILE
    value: "{{ semaphore_admin_password_file_path if semaphore_admin_password_file_enabled else '' }}"
  - name: SEMAPHORE_WEB_ROOT
    value: "{{ semaphore_web_root }}"
  - name: SEMAPHORE_CORS_ALLOWED_ORIGINS
    value: "{{ semaphore_cors_allowed_origins }}"
  - name: SEMAPHORE_SESSION_TIMEOUT
    value: "{{ semaphore_session_timeout_seconds | string }}"
  - name: SEMAPHORE_MAX_PARALLEL_TASKS
    value: "{{ semaphore_max_parallel_tasks | string }}"
  - name: SEMAPHORE_CLEANUP_DAYS
    value: "{{ semaphore_cleanup_days | string }}"
  - name: SEMAPHORE_GIT_STRICT_HOST_KEY_CHECKING
    value: "{{ 'true' if semaphore_git_strict_host_key_checking else 'false' }}"
  - name: SEMAPHORE_WEBHOOK_URL
    value: "{{ semaphore_webhook_url }}"
  - name: TZ
    value: "{{ semaphore_timezone }}"

semaphore_service_env_legacy:
  - name: SEMAPHORE_DB_PASS
    value: "{{ semaphore_db_password }}"

semaphore_secret_env_base:
  - name: SEMAPHORE_ADMIN_PASSWORD
    value: "{{ semaphore_admin_password }}"

semaphore_secret_env_legacy_db:
  - name: SEMAPHORE_DB_PASS
    value: "{{ semaphore_db_password }}"

# Base service environment values are defined before optional legacy overrides so the
# primary contract wins when duplicate keys are introduced. A runtime assertion validates
# that no duplicate environment variable names remain after the merge.
semaphore_service_env: "{{ (semaphore_service_env_base + (semaphore_render_db_password_env | ternary(semaphore_service_env_legacy, []))) | to_yaml | from_yaml }}"

semaphore_secret_env: "{{ ((semaphore_render_db_password_env | ternary(semaphore_secret_env_legacy_db, [])) + semaphore_secret_env_base) | to_yaml | from_yaml }}"

semaphore_secret_files_all:
  db_password:
    enabled: {{ semaphore_db_password_file_enabled | bool }}
    entry:
      name: semaphore-db-password
      path: "{{ semaphore_db_password_file_path }}"
      mode: '0400'
      value: "{{ semaphore_db_password }}"
  admin_password:
    enabled: {{ semaphore_admin_password_file_enabled | bool }}
    entry:
      name: semaphore-admin-password
      path: "{{ semaphore_admin_password_file_path }}"
      mode: '0400'
      value: "{{ semaphore_admin_password }}"

semaphore_secret_files: "{{ semaphore_secret_files_all | dict2items | selectattr('value.enabled') | map(attribute='value.entry') | list | to_yaml | from_yaml }}"
